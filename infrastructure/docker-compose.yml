services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: inbox-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: inbox
      RABBITMQ_DEFAULT_PASS: inbox
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16
    container_name: inbox-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: inbox_ai
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: inbox-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: inboxminio
      MINIO_ROOT_PASSWORD: inboxminio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav:stable
    container_name: inbox-clamav
    ports:
      - "3310:3310"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: ai-inbox-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_WEBHOOK_URL: "http://192.168.1.132:8102/emails/mailpit/webhook"
    

volumes:
  rabbitmq_data:
  postgres_data:
  minio_data: